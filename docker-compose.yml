services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api:/app/api
      - ./modelo:/app/modelo
    ports:
      - "8000:8000"

  frontend:
    build: .
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    volumes:
      - ./app.py:/app/app.py
      - ./utils:/app/utils
    environment:
      API_URL: http://api:8000/predictAI/multiple
    depends_on:
      - api
    ports:
      - "8501:8501"