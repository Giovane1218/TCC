services:
  api:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    command: streamlit run Src/View/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000/predictAI
    depends_on:
      - api
    ports:
      - "8501:8501"